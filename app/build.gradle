apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.hud.delivery'
    compileSdk 34

    defaultConfig {
        applicationId "com.hud.delivery"
        minSdk 26
        targetSdk 34
        versionCode 92
        versionName "1.0.55"
    }

    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            // 自用工具：直接复用 debug 签名，免去额外配置
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // UI 用 Compose 画三个大数字；自绘 HudView 保留为备选，设置里可切换
    buildFeatures {
        compose true
    }

    composeOptions {
        // 与 Kotlin 1.9.24 配套
        kotlinCompilerExtensionVersion '1.5.14'
    }

    kotlinOptions {
        // 与 engine 模块保持一致（Nordic 库是 Java 17 编译的）
        jvmTarget = '17'
    }
}

dependencies {
    // 协议层：纯 JVM 模块，可单测（gradle :protocol:test）
    implementation project(':protocol')
    // BLE 通道：BluetoothGattCallback / 重连 / 订阅（gradle :engine）
    implementation project(':engine')
    // 算法层：里程积分 / 电量查表 / 滑动平均 / 耗电自学习（gradle :core:test）
    implementation project(':core')

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
